name: Rust API

on:
  push:
    paths:
      - "backend/**"
      - "api/**"
      - "src/**"
      - "Cargo.toml"
      - "vercel.json"
      - "data/public-projects.json"
      - ".github/workflows/rust-api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "src/**"
      - "Cargo.toml"
      - "vercel.json"
      - "data/public-projects.json"
      - ".github/workflows/rust-api.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Axum API formatting
        run: cargo fmt --all -- --check
      - name: Run Axum Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Axum API
        run: cargo test --all-targets
      - name: Check Vercel Rust formatting
        working-directory: .
        run: cargo fmt --all -- --check
      - name: Check Vercel Rust Functions
        working-directory: .
        run: cargo check --bins
      - name: Run Vercel Rust Clippy
        working-directory: .
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Vercel Rust Functions
        working-directory: .
        run: cargo test --all-targets
