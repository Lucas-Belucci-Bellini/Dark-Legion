name: Rust API

on:
  push:
    paths:
      - "backend/**"
      - "api/**"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "vercel.json"
      - "data/public-projects.json"
      - "data/public-projects.sql"
      - ".github/workflows/rust-api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "vercel.json"
      - "data/public-projects.json"
      - "data/public-projects.sql"
      - ".github/workflows/rust-api.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Axum API formatting
        run: cargo fmt --all -- --check
      - name: Run Axum Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Axum API
        run: cargo test --all-targets
      - name: Check Vercel Rust formatting
        working-directory: .
        run: cargo fmt --all -- --check
      - name: Check Vercel Rust Functions
        working-directory: .
        run: cargo check --bins
      - name: Run Vercel Rust Clippy
        working-directory: .
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Vercel Rust Functions
        working-directory: .
        run: cargo test --all-targets

  postgres-integration:
    name: PostgreSQL catalog integration
    needs: check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dark_legion_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dark_legion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dark_legion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply generated public catalog SQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f data/public-projects.sql
      - name: Insert a stale row to verify pruning
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public_projects (
            slug, name, category, category_label, description,
            repository_url, website_url, status, featured, marketing_priority
          ) VALUES (
            'stale-ci-sentinel', 'Stale CI sentinel', 'Test', 'Test',
            'This row must be removed by the next catalog snapshot.',
            'https://github.com/Lucas-Belucci-Bellini/stale-ci-sentinel',
            NULL, 'Público', FALSE, 0
          );
          SQL
      - name: Reapply snapshot and prune stale rows
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f data/public-projects.sql
      - name: Verify Rust reads PostgreSQL and reports health
        run: cargo test --test postgres_catalog
