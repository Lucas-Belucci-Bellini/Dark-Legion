name: Rust API

on:
  push:
    paths:
      - "backend/**"
      - "api/**"
      - "Cargo.toml"
      - "data/public-projects.json"
      - ".github/workflows/rust-api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "Cargo.toml"
      - "data/public-projects.json"
      - ".github/workflows/rust-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Check Vercel Rust Function
        working-directory: .
        run: cargo check --bin catalog
      - name: Test Vercel Rust Function
        working-directory: .
        run: cargo test --bin catalog
