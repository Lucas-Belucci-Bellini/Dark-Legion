name: Frontend

on:
  push:
    paths:
      - "app/**"
      - "data/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "app/**"
      - "data/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
