name: Quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test public repository discovery
        run: |
          python -m py_compile scripts/discover_public_repositories.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate and regenerate SQL snapshot
        run: |
          python -m py_compile scripts/analyze_catalog.py
          python scripts/analyze_catalog.py
          git diff --exit-code -- data/public-projects.sql