name: Quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject committed build artifacts
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=True
          ).split("\\0")
          forbidden = {".next", "target", "node_modules", ".vercel", "__pycache__", "coverage"}
          offenders = [
              path for path in tracked
              if path and forbidden.intersection(PurePosixPath(path).parts)
          ]
          if offenders:
              print("Generated or local artifacts must not be committed:")
              print("\\n".join(offenders[:100]))
              if len(offenders) > 100:
                  print(f"... and {len(offenders) - 100} more")
              sys.exit(1)
          print("No generated build artifacts are tracked.")
          PY
      - name: Test public repository discovery
        run: |
          python -m py_compile scripts/discover_public_repositories.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate and regenerate SQL snapshot
        run: |
          python -m py_compile scripts/analyze_catalog.py
          python scripts/analyze_catalog.py
          git diff --exit-code -- data/public-projects.sql
